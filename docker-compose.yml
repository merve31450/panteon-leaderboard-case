services:
  redis:
    image: redis:7
    container_name: panteon-leaderboard-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  postgres:
    image: postgres:16
    container_name: panteon-leaderboard-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: panteon
      POSTGRES_PASSWORD: panteon
      POSTGRES_DB: panteon_leaderboard
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

  mongo:
    image: mongo:7
    container_name: panteon-leaderboard-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  redis_data:
  postgres_data:
  mongo_data:
